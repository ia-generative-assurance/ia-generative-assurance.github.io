// Pronoun / verb reflection applied to the fragments captured by "*".

  "am":"are","was":"were","i":"you","i'd":"you would","i've":"you have",
  "i'll":"you will","i'm":"you are","my":"your","me":"you","you've":"I have",
  "you'll":"I will","you're":"I am","your":"my","yours":"mine","you":"I",
  "are":"am","were":"was","myself":"yourself","yourself":"myself"
};

function reflect(fragment){
  const table = P().reflections;
  return fragment.trim().split(/\s+/).map(w=>{
    const key = w.toLowerCase().replace(/[.,!?;:]+$/,"");
    return Object.prototype.hasOwnProperty.call(table, key) ? table[key] : w;
  }).join(" ");
}

let LANG = "fr";
const P = () => PACKS[LANG];

// Build a regex from a decomposition pattern: "*" -> capture group,
// "@name" -> alternation of its synonyms (also captured), words literal.
function decompToRegex(decomp){
  const parts = decomp.trim().split(/\s+/).map(tok=>{
    if(tok === "*") return "(.*)";
    if(tok.startsWith("@")){
      const grp = P().synonyms[tok.slice(1)] || [tok.slice(1)];
      return "(" + grp.map(escapeRe).join("|") + ")";
    }
    return escapeRe(tok);
  });
  // tolerate flexible spacing/punctuation between tokens
  return new RegExp("^\\s*" + parts.join("\\s*") + "\\s*$", "i");
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }

function fill(template, groups){
  return template.replace(/\((\d+)\)/g, (_,n)=>{
    const g = groups[Number(n)] || "";
    return reflect(g);
  }).replace(/\s+([.?!,])/g,"$1");
}

// Cursor used by the reassembly cycler to vary replies per rule.
const cursor = new Map();
function pickReasmb(rule){
  const key = rule.decomp;
  const i = cursor.get(key) || 0;
  cursor.set(key, (i+1) % rule.reasmb.length);
  return rule.reasmb[i];
}

const memory = [];

function cleanInput(text){
  // ELIZA split on punctuation and kept the first clause with a keyword;
  // we keep it simple: strip trailing punctuation, collapse spaces.
  // l'apostrophe typographique devient droite : les motifs ecrivent j'ai
  return text.replace(/[\u2019\u02bc]/g,"'").replace(/[.!?;]+/g," ").replace(/\s+/g," ").trim();
}

function respond(raw){
  const input = cleanInput(raw);
  if(!input) return P().vide;
  const lower = " " + input.toLowerCase() + " ";

  // collect matching keywords; highest rank first, then the keyword that
  // appears earliest in the sentence (as the original ELIZA scanned).
  const found = P().script
    .map((k,idx)=>{
      // \b est ASCII : « \bcolere\b » avec un accent ne matcherait jamais,
      // les lettres accentuees n'etant pas des caracteres de mot pour lui.
      // On borne donc sur les lettres Unicode.
      const m = lower.match(new RegExp("(?<![\\p{L}\\p{N}])"+escapeRe(k.word)+"(?![\\p{L}\\p{N}])","iu"));
      return { k, idx, pos: m ? m.index : -1 };
    })
    .filter(o=> o.pos>=0)
    .sort((a,b)=> (b.k.rank-a.k.rank) || (a.pos-b.pos) || (a.idx-b.idx));

  for(const {k} of found){
    for(const rule of k.rules){
      const m = input.match(decompToRegex(rule.decomp));
      if(m){
        // store a memory line when a "my ..." statement is seen
        if(k.memory && m[2]){
          memory.push(P().souvenir(reflect(m[2])));
          if(memory.length>5) memory.shift();
        }
        return fill(pickReasmb(rule), m);
      }
    }
  }

  // no keyword matched: sometimes recall a memory, else a neutral prompt
  if(memory.length && Math.random()<0.4) return memory.shift();
  const liste = P().xnone;
  const i = cursor.get("xnone") || 0;
  cursor.set("xnone",(i+1)%liste.length);
  return liste[i];
}

  row.textContent = text;
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function elizaSay(text){
  // tiny typing delay for the period feel
  const row = document.createElement("div");
  row.className = "row eliza";
  row.setAttribute("data-qui", P().elle);
  log.appendChild(row);
  let i = 0;
  const timer = setInterval(()=>{
    row.textContent = text.slice(0,++i);
    log.scrollTop = log.scrollHeight;
    if(i>=text.length){ clearInterval(timer); }
  }, 12);
}

form.addEventListener("submit", e=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  add(text,"you");
  input.value = "";
  setTimeout(()=> elizaSay(respond(text)), 250);
});

// Changer de version repart d'un ecran vide : sinon deux jeux de regles se
// melangent dans le meme fil et la demonstration devient illisible.
const selVersion = document.getElementById("version");
function poser(){
  document.documentElement.lang = LANG === "en" ? "en" : "fr";
  document.getElementById("sstitre").textContent = P().sstitre;
  document.getElementById("pied").textContent = P().pied;
  log.innerHTML = "";
  memory.length = 0;
  cursor.clear();
  elizaSay(P().bonjour);
}
selVersion.addEventListener("change", ()=>{ LANG = selVersion.value; poser(); input.focus(); });
poser();

// Le curseur ne se place tout seul que si la demo est ouverte seule. Dans une
// iframe, donner le focus a un champ fait defiler la page hote jusqu'a lui :
// on arrivait sur comprendre.html directement sur ELIZA, au milieu de la page.
// Integree, la demo attend donc un clic pour prendre le curseur.
if (window.top === window.self) {
  input.focus();
} else {
  document.addEventListener("click", () => input.focus());
}
</script>
